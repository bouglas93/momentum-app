name: Build Momentum Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get the source ZIP from this repository
        uses: actions/checkout@v4

      - name: Set up free Java build tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract and build the native widget app
        run: |
          unzip -q Momentum-Source.zip -d workspace
          cd workspace/MomentumAndroid
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Momentum.apk"

      - name: Provide the installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Momentum-Android-APK
          path: Momentum.apk
          retention-days: 14
